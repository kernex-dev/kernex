[package]
name = "kernex-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, traits, config, and error handling for Kernex"
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
basic-toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# `#[tokio::test]` needs the macros and a runtime, which the `sync`
# feature above does not bring; without them `cargo test -p kernex-core`
# fails on its own and passes only in the workspace run.
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
yaml = ["dep:serde_yaml_ng"]

[lints]
workspace = true
