[advisories]
# RUSTSEC-2023-0071: Marvin Attack timing sidechannel in the rsa crate.
# This advisory has no upstream fix (rsa 0.9.x is unpatched).
# rsa enters the dependency tree via sqlx-mysql, which is compiled by
# sqlx-macros-core even when only the sqlite feature is enabled.
# This project uses SQLite exclusively; MySQL is never activated.
# Risk is accepted because the vulnerable code path is never executed.
#
# RUSTSEC-2026-0459: SQLite before 3.54.0 can return uninitialized page-cache
# memory when it opens a database with a crafted sibling `-wal` file.
# Local vector only: kernex-memory opens its own database, created with mode
# 0600 in the user's data directory. The fix needs libsqlite3-sys >= 0.39,
# which arrives with sqlx 0.9 (Rust 1.94+). Reviewed 2026-11-20; remove at the
# sqlx upgrade.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]
