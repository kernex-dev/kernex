# Publish-to-crates.io workflow.
#
# Triggers on push of `v[0-9]+.[0-9]+.[0-9]+` tags created by release-plz when
# the Release PR merges. Runs the pre-commit gate, then publishes each crate
# in dependency order with a wait between steps so crates.io's index has time
# to propagate the previous publish before the next crate's dependency
# resolution runs.
#
# Auth: uses crates.io trusted publishing via GitHub OIDC. No long-lived
# CARGO_REGISTRY_TOKEN secret is read here. The token is minted at job time
# by `rust-lang/crates-io-auth-action` and bound to the workflow + repo +
# environment registered for each crate at
# `https://crates.io/crates/<name>/settings -> Trusted Publishing`. The
# `permissions: id-token: write` block on the publish job is mandatory for
# OIDC token exchange. See RFC 3691 and the action README:
#   https://github.com/rust-lang/crates-io-auth-action
#   https://rust-lang.github.io/rfcs/3691-trusted-publishing-cratesio.html
#
# The token and the build never meet. Each crate is packaged and verified
# (compiled, which runs the build scripts of every dependency) in a step
# that has no token, then uploaded with `--no-verify` in a step that has
# it and compiles nothing. The publish job restores no build cache: a
# cache is written by other runs, and this job's output is what users
# install.
#
# Failure mode: if any publish step fails, the workflow halts. Each step
# runs `scripts/publish-if-needed.sh`, which skips crates whose version is
# already live on crates.io, so the recovery is simply re-dispatching the
# workflow: completed publishes are skipped and the chain resumes at the
# crate that failed. (Manual `cargo publish` recovery is no longer possible
# from a workstation: the long-lived registry token was deleted with the
# OIDC trusted-publishing migration.) Yanking a bad publish is a separate
# manual step against crates.io.

name: publish-crates

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual escape hatch:
  # - Fires the same gate + OIDC publish chain against any `v*` tag.
  # - Needed when a tag push does not start this workflow: a tag created
  #   with a workflow's default GITHUB_TOKEN triggers nothing. release-plz
  #   tags through its GitHub App, so its tags start the run on their own.
  # - Also useful for emergency republishes or yank recovery, and to resume
  #   a failed chain: each step skips a crate that is already live.
  # Usage: `gh workflow run publish-crates.yml --ref v<version>`
  # The tag is the ref the run is dispatched on; there is no separate input.
  # A dispatch on a branch is refused by the first step of each job.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # See ci.yml for the cache-namespace rationale; same string keeps the
  # publish-gate cache aligned with the CI cache.
  CACHE_NAMESPACE: v1-rust-2026-05-10

# Serialize publish runs across rapid tag pushes; never cancel an in-flight
# publish since `cargo publish` is not idempotent against crates.io.
concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Pre-publish gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*) echo "publishing from $REF" ;;
            *) echo "error: this workflow publishes from a release tag, not $REF" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ env.CACHE_NAMESPACE }}

      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check

  publish:
    name: Publish crates in dependency order
    needs: gate
    runs-on: ubuntu-latest
    # Bind to the `release` GitHub Environment so optional protection rules
    # (required reviewer, wait timer) can be configured in repo Settings ->
    # Environments. The crates.io trusted-publisher registration for each
    # of the 9 crates must list `release` as the environment name.
    environment: release
    timeout-minutes: 60
    permissions:
      # Required for OIDC token exchange with crates.io. Without this,
      # rust-lang/crates-io-auth-action errors at token mint time.
      id-token: write
      contents: read
    steps:
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*) echo "publishing from $REF" ;;
            *) echo "error: this workflow publishes from a release tag, not $REF" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # No build cache here on purpose; see the header.

      - name: Mint crates.io OIDC token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # Publish chain, each crate after the crates it depends on:
      #   kernex-core -> kernex-sandbox -> kernex-memory -> kernex-pipelines ->
      #   kernex-skills -> kernex-providers -> kernex-adapter-core ->
      #   kernex-runtime -> kernex
      #
      # `kernex-adapter-core` ships before `kernex-runtime` because the
      # runtime crate's published Cargo.toml requires resolving it from
      # crates.io (the workspace path-dep is dev-only).
      #
      # Each publish is followed by a 30s wait to let crates.io's index
      # propagate before the next dependency resolution runs.
      #
      # CARGO_REGISTRY_TOKEN is set only on the `publish` steps, from the
      # OIDC auth step's output. The `package` steps compile and must not
      # see it; the script refuses to package when the variable is set.

      - name: Package kernex-core
        run: ./scripts/publish-if-needed.sh package kernex-core
      - name: Publish kernex-core
        run: ./scripts/publish-if-needed.sh publish kernex-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: sleep 30

      - name: Package kernex-sandbox
        run: ./scripts/publish-if-needed.sh package kernex-sandbox
      - name: Publish kernex-sandbox
        run: ./scripts/publish-if-needed.sh publish kernex-sandbox
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: sleep 30

      - name: Package kernex-memory
        run: ./scripts/publish-if-needed.sh package kernex-memory
      - name: Publish kernex-memory
        run: ./scripts/publish-if-needed.sh publish kernex-memory
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: sleep 30

      - name: Package kernex-pipelines
        run: ./scripts/publish-if-needed.sh package kernex-pipelines
      - name: Publish kernex-pipelines
        run: ./scripts/publish-if-needed.sh publish kernex-pipelines
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: sleep 30

      - name: Package kernex-skills
        run: ./scripts/publish-if-needed.sh package kernex-skills
      - name: Publish kernex-skills
        run: ./scripts/publish-if-needed.sh publish kernex-skills
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: sleep 30

      - name: Package kernex-providers
        run: ./scripts/publish-if-needed.sh package kernex-providers
      - name: Publish kernex-providers
        run: ./scripts/publish-if-needed.sh publish kernex-providers
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: sleep 30

      - name: Package kernex-adapter-core
        run: ./scripts/publish-if-needed.sh package kernex-adapter-core
      - name: Publish kernex-adapter-core
        run: ./scripts/publish-if-needed.sh publish kernex-adapter-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: sleep 30

      - name: Package kernex-runtime
        run: ./scripts/publish-if-needed.sh package kernex-runtime
      - name: Publish kernex-runtime
        run: ./scripts/publish-if-needed.sh publish kernex-runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: sleep 30

      - name: Package kernex (umbrella)
        run: ./scripts/publish-if-needed.sh package kernex
      - name: Publish kernex (umbrella)
        run: ./scripts/publish-if-needed.sh publish kernex
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
